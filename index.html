<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saad's Personal Salah Tracker</title>
    <!-- Firebase SDKs (v10 Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }
        h1, h2 { text-align: center; color: #4da6ff; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 25px; }
        .hidden { display: none !important; }
        
        /* Auth Form Styles */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input[type="email"], input[type="password"], input[type="date"] {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background-color: #2a2a2a; color: white; box-sizing: border-box; font-size: 16px;
        }
        button {
            width: 100%; padding: 12px; border-radius: 8px; border: none;
            font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary { background-color: #4da6ff; color: #121212; }
        .btn-secondary { background-color: transparent; color: #4da6ff; border: 1px solid #4da6ff; }
        .divider { text-align: center; margin: 15px 0; color: #666; font-size: 14px; }
        .toggle-auth { text-align: center; margin-top: 15px; color: #aaa; font-size: 14px; cursor: pointer; }
        
        /* App Styles */
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-email { font-size: 12px; color: #888; }
        .logout-link { color: #cf6679; cursor: pointer; font-size: 12px; text-decoration: underline; }
        .date-picker-container { margin-bottom: 20px; }
        
        .prayer-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px; background-color: #2a2a2a; margin-bottom: 12px;
            border-radius: 10px; cursor: pointer; transition: background 0.2s;
        }
        .prayer-item:hover { background-color: #333333; }
        .prayer-info { display: flex; align-items: center; gap: 12px; font-size: 18px; }
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: #4da6ff; cursor: pointer; }
        .completed { background-color: #1b3a24 !important; border: 1px solid #2e7d32; }
        .completed span { text-decoration: line-through; color: #a5d6a7; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. AUTHENTICATION SCREEN -->
    <div id="auth-screen">
        <h1 id="auth-title">Welcome Back</h1>
        <div class="subtitle">Your private, ad-free spiritual journal</div>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="auth-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="auth-password" placeholder="••••••••">
        </div>
        
        <button class="btn-primary" id="btn-submit" onclick="handleAuth()">Login</button>
        
        <div class="divider">OR</div>
        
        <button class="btn-secondary" onclick="handleGoogleAuth()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4da6ff" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.47h4.84c-.21 1.12-.84 2.07-1.79 2.7l2.79 2.16c1.63-1.51 2.57-3.73 2.57-6.49z"/><path fill="#4da6ff" d="M9 18c2.43 0 4.47-.8 5.96-2.2l-2.79-2.16c-.78.52-1.77.83-2.79.83-2.14 0-3.94-1.45-4.59-3.41L1.93 13.9C3.41 16.84 6.45 18 9 18z"/><path fill="#4da6ff" d="M4.41 11.06c-.17-.52-.26-1.07-.26-1.64s.09-1.12.26-1.64V5.23H1.93C1.35 6.39 1 7.66 1 9s.35 2.61.93 3.77l2.48-1.71z"/><path fill="#4da6ff" d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.4C13.46.96 11.42 0 9 0 6.45 0 3.41 1.16 1.93 4.1L4.41 5.8c.65-1.96 2.45-3.41 4.59-3.41z"/></svg>
            Continue with Google
        </button>

        <div class="toggle-auth" id="btn-toggle" onclick="toggleAuthMode()">Don't have an account? Sign Up</div>
    </div>

    <!-- 2. MAIN TRACKER APP SCREEN -->
    <div id="app-screen" class="hidden">
        <div class="header-bar">
            <div>
                <span class="user-email" id="display-user">loading...</span>
            </div>
            <span class="logout-link" onclick="logout()">Logout</span>
        </div>

        <h1>Salah Tracker</h1>
        
        <!-- Date Selector to view history -->
        <div class="date-picker-container">
            <label>Viewing Data For:</label>
            <input type="date" id="tracker-date" onchange="loadDateData()">
        </div>

        <div id="checklist"></div>
    </div>
</div>

<script>
    // Complete Firebase app credentials[cite: 8]
    const firebaseConfig = {
        apiKey: "AIzaSyCf3fUwyksRPnVygjrLpTxdnZxDYA_4Mo",
        authDomain: "prayer-tracker-d9d1f.firebaseapp.com",
        projectId: "prayer-tracker-d9d1f",
        storageBucket: "prayer-tracker-d9d1f.firebasestorage.app",
        messagingSenderId: "904988992102",
        appId: "1:904988992102:web:7873d573ef7e9520383a77",
        measurementId: "G-P7VLZ78NC1"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isSignUpMode = false;
    let currentSelectedDate = '';
    const prayers = [
        { id: 'fajr', name: 'Fajr', emoji: '🌅' },
        { id: 'dhuhr', name: 'Dhuhr', emoji: '☀️' },
        { id: 'asr', name: 'Asr', emoji: '🌤️' },
        { id: 'maghrib', name: 'Maghrib', emoji: '🌇' },
        { id: 'isha', name: 'Isha', emoji: '🌙' }
    ];

    // Listen for sign-in state changes
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('display-user').innerText = user.email || user.displayName;
            
            // Set current local date value automatically in YYYY-MM-DD
            const today = new Date().toLocaleDateString('sv');
            document.getElementById('tracker-date').value = today;
            currentSelectedDate = today;
            
            loadDateData();
        } else {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }
    });

    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('auth-title').innerText = isSignUpMode ? "Create Account" : "Welcome Back";
        document.getElementById('btn-submit').innerText = isSignUpMode ? "Sign Up" : "Login";
        document.getElementById('btn-toggle').innerText = isSignUpMode ? "Already have an account? Login" : "Don't have an account? Sign Up";
    }

    function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;

        if(!email || !password) return alert("Please fill in all fields.");

        if (isSignUpMode) {
            auth.createUserWithEmailAndPassword(email, password).catch(err => alert(err.message));
        } else {
            auth.signInWithEmailAndPassword(email, password).catch(err => alert(err.message));
        }
    }

    function handleGoogleAuth() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("Google Login Failed: " + err.message));
    }

    function logout() {
        auth.signOut();
    }

    function loadDateData() {
        const user = auth.currentUser;
        if (!user) return;

        currentSelectedDate = document.getElementById('tracker-date').value;
        const docRef = db.collection('users').doc(user.uid).collection('history').doc(currentSelectedDate);

        docRef.get().then(doc => {
            let savedData = {};
            if (doc.exists) {
                savedData = doc.data();
            }
            renderChecklist(savedData);
        }).catch(err => console.error("Error fetching data: ", err));
    }

    function renderChecklist(savedData) {
        const container = document.getElementById('checklist');
        container.innerHTML = '';

        prayers.forEach(prayer => {
            const isChecked = savedData[prayer.id] === true;

            const item = document.createElement('div');
            item.className = `prayer-item ${isChecked ? 'completed' : ''}`;
            item.setAttribute('onclick', `togglePrayer('${prayer.id}', ${isChecked})`);

            item.innerHTML = `
                <div class="prayer-info">
                    <span>${prayer.emoji}</span>
                    <span>${prayer.name}</span>
                </div>
                <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); togglePrayer('${prayer.id}', ${isChecked})">
            `;
            container.appendChild(item);
        });
    }

    function togglePrayer(prayerId, currentStatus) {
        const user = auth.currentUser;
        if (!user) return;
        const docRef = db.collection('users').doc(user.uid).collection('history').doc(currentSelectedDate);
        docRef.set({
            [prayerId]: !currentStatus
        }, { merge: true }).then(() => {
            loadDateData();
        }).catch(err => alert("Failed to save data: " + err.message));
    }
</script>
</body>
</html>
