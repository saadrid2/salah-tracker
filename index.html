<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salah Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--green:#10b981;--glow:rgba(16,185,129,.25);--gold:#fbbf24;--blue:#3b82f6;--red:#ef4444;--text:#f8fafc;--sub:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
body{background:var(--bg) radial-gradient(circle at 15% 15%,rgba(16,185,129,.08),transparent 45%),radial-gradient(circle at 85% 85%,rgba(59,130,246,.08),transparent 45%);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px 12px}
.container{width:100%;max-width:520px;background:rgba(30,41,59,.85);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 20px 40px rgba(0,0,0,.4);overflow:hidden}
.hidden{display:none!important}
button,input,textarea{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.loading{text-align:center;padding:40px 0;color:var(--green)}
.loading i{font-size:32px;animation:spin 1s linear infinite}
.loading p{margin-top:12px;font-size:13px;color:var(--sub)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.auth-header{text-align:center;margin-bottom:24px}
.auth-icon{font-size:40px;color:var(--green);margin-bottom:12px}
.auth-header h1{font-size:24px;margin-bottom:6px}
.auth-header p{color:var(--sub);font-size:14px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-bottom:6px}
.form-control{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(15,23,42,.6);font-size:15px}
.form-control:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--glow);outline:none}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.btn-primary{background:var(--green);color:#0f172a}
.btn-google{background:rgba(255,255,255,.05);border:1px solid var(--line);margin-top:14px}
.divider{text-align:center;margin:18px 0;position:relative;font-size:12px;color:var(--sub)}
.divider::before{content:"";position:absolute;left:0;top:50%;width:100%;height:1px;background:var(--line)}
.divider span{position:relative;background:#1b2536;padding:0 12px}
.auth-links{display:flex;justify-content:space-between;margin-top:16px}
.link-btn{background:none;border:none;color:var(--green);font-weight:600;font-size:13px;cursor:pointer}
.app-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.user-info{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.user-info h4{font-size:14px}
.user-info p{font-size:12px;color:var(--sub)}
.logout-btn{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:8px 10px;border-radius:8px}
.progress-card{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(59,130,246,.05));border:1px solid rgba(16,185,129,.2);border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.progress-card h3{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.streak{background:rgba(251,191,36,.15);color:var(--gold);border:1px solid rgba(251,191,36,.3);padding:2px 8px;border-radius:12px;font-size:12px;font-weight:700}
.progress-card p{font-size:12px;color:var(--sub)}
.ring{position:relative;width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--green) 0deg,var(--line) 0deg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring::before{content:"";position:absolute;width:46px;height:46px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-size:12px;font-weight:700}
.date-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;background:rgba(15,23,42,.4);padding:8px 12px;border-radius:14px;border:1px solid var(--line)}
.date-btn{background:none;border:none;color:var(--sub);font-size:14px;padding:8px 12px;border-radius:8px;cursor:pointer}
.date-btn:disabled{opacity:.3;cursor:default}
.date-input{background:none;border:none;font-weight:600;font-size:14px;text-align:center;cursor:pointer;color-scheme:dark}
.hijri{font-size:12px;color:var(--gold);text-align:center;margin-bottom:14px;min-height:16px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{background:none;border:none;font-size:13px;font-weight:600;color:var(--sub);padding:8px 12px;border-radius:8px;cursor:pointer}
.tab.active{color:var(--green);background:rgba(16,185,129,.1)}
.prayer-card{background:rgba(15,23,42,.5);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.prayer-head{display:flex;align-items:center;gap:12px}
.prayer-icon{font-size:18px;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.prayer-title{font-size:15px;font-weight:600}
.prayer-time{font-size:12px;color:var(--gold)}
.status-group{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.08)}
.status-btn{flex:1;padding:9px 2px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--sub);cursor:pointer}
.status-btn.a-jamaah{background:rgba(16,185,129,.2);border-color:var(--green);color:var(--green)}
.status-btn.a-individual{background:rgba(59,130,246,.2);border-color:var(--blue);color:var(--blue)}
.status-btn.a-late{background:rgba(251,191,36,.2);border-color:var(--gold);color:var(--gold)}
.status-btn.a-missed{background:rgba(239,68,68,.2);border-color:var(--red);color:var(--red)}
.sunnah-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(15,23,42,.4);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:500;text-align:left}
.sunnah-item i{color:var(--sub);font-size:18px}
.sunnah-item.done{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3)}
.sunnah-item.done i{color:var(--green)}
.notes-label{font-size:12px;color:var(--sub);font-weight:600}
.reflection{width:100%;height:100px;background:rgba(15,23,42,.5);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;resize:none;margin-top:8px}
.save-status{font-size:12px;color:var(--sub);text-align:right;margin-top:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--green);color:#0f172a;font-weight:700;font-size:13px;padding:10px 20px;border-radius:30px;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:transform .3s;z-index:1000}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red);color:#fff}
</style>
</head>
<body>
<div class="container">
  <div id="loading" class="loading"><i class="fa-solid fa-spinner"></i><p>Loading Salah Tracker...</p></div>

  <div id="auth-screen" class="hidden">
    <div class="auth-header">
      <div class="auth-icon"><i class="fa-solid fa-kaaba"></i></div>
      <h1 id="auth-title">Welcome back</h1>
      <p>Your private, ad-free prayer journal</p>
    </div>
    <form onsubmit="handleAuthSubmit(event)">
      <div class="form-group"><label for="auth-email">Email address</label>
        <input type="email" id="auth-email" class="form-control" placeholder="you@example.com" autocomplete="email" required></div>
      <div class="form-group"><label for="auth-password">Password</label>
        <input type="password" id="auth-password" class="form-control" placeholder="At least 6 characters" minlength="6" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-primary" id="btn-submit">Log in</button>
    </form>
    <div class="divider"><span>or</span></div>
    <button type="button" class="btn btn-google" onclick="handleGoogleAuth()">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.47h4.84c-.21 1.12-.84 2.07-1.79 2.7l2.79 2.16c1.63-1.51 2.57-3.73 2.57-6.49z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.2l-2.79-2.16c-.78.52-1.77.83-2.79.83-2.14 0-3.94-1.45-4.59-3.41L1.93 13.9C3.41 16.84 6.45 18 9 18z"/><path fill="#FBBC05" d="M4.41 11.06c-.17-.52-.26-1.07-.26-1.64s.09-1.12.26-1.64V5.23H1.93C1.35 6.39 1 7.66 1 9s.35 2.61.93 3.77l2.48-1.71z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.4C13.46.96 11.42 0 9 0 6.45 0 3.41 1.16 1.93 4.1L4.41 5.8c.65-1.96 2.45-3.41 4.59-3.41z"/></svg>
      Continue with Google
    </button>
    <div class="auth-links">
      <button type="button" class="link-btn" id="btn-toggle" onclick="toggleAuthMode()">Need an account? Sign up</button>
      <button type="button" class="link-btn" onclick="handleForgotPassword()">Forgot password?</button>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <div class="app-header">
      <div class="user-info">
        <div class="avatar" id="user-avatar">U</div>
        <div><h4 id="display-name">User</h4><p id="display-email"></p></div>
      </div>
      <button class="logout-btn" onclick="logout()" aria-label="Log out"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
    <div class="date-bar">
      <button class="date-btn" onclick="changeDate(-1)" aria-label="Previous day"><i class="fa-solid fa-chevron-left"></i></button>
      <input type="date" id="tracker-date" class="date-input" aria-label="Choose date" onchange="loadDateData()">
      <button class="date-btn" id="next-btn" onclick="changeDate(1)" aria-label="Next day"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div id="hijri-display" class="hijri"></div>
    <div class="progress-card">
      <div>
        <h3>Daily completion <span class="streak" id="streak-counter"><i class="fa-solid fa-fire"></i> 0 day streak</span></h3>
        <p id="completed-count-text">0 of 5 fardh prayers logged</p>
      </div>
      <div class="ring" id="progress-circle"><span id="progress-percentage">0%</span></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" aria-controls="tab-fardh" onclick="switchTab('fardh',this)">Fardh prayers</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-sunnah" onclick="switchTab('sunnah',this)">Sunnah &amp; extra</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-notes" onclick="switchTab('notes',this)">Reflections</button>
    </div>
    <div id="tab-fardh" role="tabpanel"><div id="prayer-list"></div></div>
    <div id="tab-sunnah" role="tabpanel" class="hidden"><div id="sunnah-list"></div></div>
    <div id="tab-notes" role="tabpanel" class="hidden">
      <label for="reflection-text" class="notes-label">Daily notes &amp; reflections</label>
      <textarea id="reflection-text" class="reflection" placeholder="Surahs memorized, thoughts, reminders for today..." oninput="handleReflectionInput()"></textarea>
      <div class="save-status" id="save-status" aria-live="polite">Saved</div>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status">Saved</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCf3fUwyksRPnVyqjrLJpTxdnZxDYA_4Mo",
  authDomain: "prayer-tracker-d9d1f.firebaseapp.com",
  projectId: "prayer-tracker-d9d1f",
  storageBucket: "prayer-tracker-d9d1f.firebasestorage.app",
  messagingSenderId: "904988992102",
  appId: "1:904988992102:web:7873d573ef75e9520383a7",
  measurementId: "G-P7VLZ78NC1"
};
// Prayer-time settings. method 17 = JAKIM (Malaysia). Change lat/lng/method for another place.
const PRAYER_CONFIG = { lat: 3.1390, lng: 101.6869, method: 17 };

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); // offline support

const $ = id => document.getElementById(id);
let isSignUp = false, currentDate = '', localDayData = {}, times = {};
let loadToken = 0, timesToken = 0, noteTimer = null;

const prayers = [
  { id: 'fajr', name: 'Fajr', icon: '🌅' }, { id: 'dhuhr', name: 'Dhuhr', icon: '☀️' },
  { id: 'asr', name: 'Asr', icon: '🌤️' }, { id: 'maghrib', name: 'Maghrib', icon: '🌇' },
  { id: 'isha', name: 'Isha', icon: '🌙' }
];
const sunnahPrayers = [
  { id: 'tahajjud', name: 'Tahajjud (night prayer)' }, { id: 'duha', name: 'Duha (forenoon)' },
  { id: 'rawatib', name: 'Sunnah Rawatib' }, { id: 'witr', name: 'Witr prayer' }
];
const AUTH_ERR = {
  'auth/invalid-credential': 'Incorrect email or password.',
  'auth/wrong-password': 'Incorrect email or password.',
  'auth/user-not-found': 'Incorrect email or password.',
  'auth/email-already-in-use': 'An account with this email already exists. Try logging in.',
  'auth/weak-password': 'Password must be at least 6 characters.',
  'auth/invalid-email': 'Enter a valid email address.',
  'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.',
  'auth/network-request-failed': 'No connection. Check your internet and try again.'
};
const authMsg = e => AUTH_ERR[e.code] || e.message;
const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dayRef = date => db.collection('users').doc(auth.currentUser.uid).collection('history').doc(date);

function showToast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => t.classList.remove('show'), 2000);
}
const setSave = s => { $('save-status').textContent = s; };

/* ---------- Auth ---------- */
auth.getRedirectResult().catch(err => alert(authMsg(err)));

auth.onAuthStateChanged(user => {
  $('loading').classList.add('hidden');
  if (user) {
    $('auth-screen').classList.add('hidden');
    $('app-screen').classList.remove('hidden');
    const name = user.displayName || (user.email || 'User').split('@')[0];
    $('display-name').textContent = name;
    $('display-email').textContent = user.email || '';
    $('user-avatar').textContent = name.charAt(0).toUpperCase();
    const today = fmt(new Date());
    $('tracker-date').max = today;
    $('tracker-date').value = today;
    loadDateData();
    refreshStreak();
  } else {
    localDayData = {}; times = {}; currentDate = '';
    $('streak-counter').innerHTML = '<i class="fa-solid fa-fire"></i> 0 day streak';
    $('auth-password').value = '';
    $('app-screen').classList.add('hidden');
    $('auth-screen').classList.remove('hidden');
  }
});

function toggleAuthMode() {
  isSignUp = !isSignUp;
  $('auth-title').textContent = isSignUp ? 'Create account' : 'Welcome back';
  $('btn-submit').textContent = isSignUp ? 'Sign up' : 'Log in';
  $('btn-toggle').textContent = isSignUp ? 'Have an account? Log in' : 'Need an account? Sign up';
  $('auth-password').autocomplete = isSignUp ? 'new-password' : 'current-password';
}
function handleAuthSubmit(e) {
  e.preventDefault();
  const email = $('auth-email').value.trim(), pw = $('auth-password').value;
  if (pw.length < 6) return alert('Password must be at least 6 characters.');
  const p = isSignUp ? auth.createUserWithEmailAndPassword(email, pw) : auth.signInWithEmailAndPassword(email, pw);
  p.catch(err => alert(authMsg(err)));
}
function handleGoogleAuth() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(err.code)) {
      auth.signInWithRedirect(provider);
    } else if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(err.code)) {
      alert(authMsg(err));
    }
  });
}
function handleForgotPassword() {
  const email = $('auth-email').value.trim();
  if (!email) return alert('Enter your email address first, then tap "Forgot password?".');
  auth.sendPasswordResetEmail(email)
    .then(() => alert('If an account exists for that email, a reset link is on its way.'))
    .catch(err => alert(authMsg(err)));
}
function logout() { flushNote(); auth.signOut(); }

/* ---------- Navigation ---------- */
function changeDate(delta) {
  const input = $('tracker-date');
  if (!input.value) return;
  const [y, m, d] = input.value.split('-').map(Number);
  const next = new Date(y, m - 1, d + delta);
  const s = fmt(next);
  if (input.max && s > input.max) return;
  input.value = s;
  loadDateData();
}
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
  el.classList.add('active'); el.setAttribute('aria-selected', 'true');
  ['fardh', 'sunnah', 'notes'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== name));
}

/* ---------- Notes (debounced autosave) ---------- */
function handleReflectionInput() {
  setSave('Typing...');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { noteTimer = null; saveReflection(); }, 1000);
}
function flushNote() {
  if (!noteTimer) return;
  clearTimeout(noteTimer); noteTimer = null;
  saveReflection();
}
function saveReflection() {
  if (!auth.currentUser || !currentDate) return;
  const text = $('reflection-text').value;
  localDayData.notes = text;
  setSave('Saving...');
  dayRef(currentDate).set({ notes: text }, { merge: true })
    .then(() => setSave('Saved'))
    .catch(() => { setSave('Not saved'); showToast("Couldn't save your note", true); });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushNote(); });
window.addEventListener('pagehide', flushNote);

/* ---------- Load / save a day ---------- */
function loadDateData() {
  if (!auth.currentUser || !$('tracker-date').value) return;
  flushNote(); // saves pending note to the previous date first
  currentDate = $('tracker-date').value;
  $('next-btn').disabled = currentDate >= $('tracker-date').max;
  const token = ++loadToken;
  fetchTimes(currentDate);
  localDayData = {};
  $('reflection-text').value = '';
  renderAll();
  dayRef(currentDate).get().then(doc => {
    if (token !== loadToken) return; // ignore stale responses
    localDayData = doc.exists ? doc.data() : {};
    $('reflection-text').value = localDayData.notes || '';
    setSave('Saved');
    renderAll();
  }).catch(() => { if (token === loadToken) showToast("Couldn't load this day", true); });
}

function setPrayerStatus(id, status) {
  if (!auth.currentUser) return;
  const date = currentDate, prev = localDayData[id];
  const cur = prev === true ? 'individual' : prev;
  const next = cur === status ? 'none' : status;
  localDayData[id] = next;
  renderFardh(); updateProgress();
  dayRef(date).set({ [id]: next }, { merge: true })
    .then(() => { showToast('Updated'); refreshStreak(); })
    .catch(() => {
      if (date === currentDate) { localDayData[id] = prev; renderFardh(); updateProgress(); }
      showToast("Couldn't save. Try again.", true);
    });
}
function toggleSunnah(id) {
  if (!auth.currentUser) return;
  const date = currentDate, prev = localDayData[id] === true;
  localDayData[id] = !prev;
  renderSunnah();
  dayRef(date).set({ [id]: !prev }, { merge: true })
    .then(() => showToast('Saved'))
    .catch(() => {
      if (date === currentDate) { localDayData[id] = prev; renderSunnah(); }
      showToast("Couldn't save. Try again.", true);
    });
}

/* ---------- Rendering ---------- */
function renderAll() { renderFardh(); renderSunnah(); updateProgress(); }

function renderFardh() {
  const box = $('prayer-list');
  box.innerHTML = '';
  prayers.forEach(p => {
    let s = localDayData[p.id];
    if (s === true) s = 'individual';
    if (!s) s = 'none';
    const raw = times[p.name] || '';
    const tm = /^\d{2}:\d{2}/.test(raw) ? raw.slice(0, 5) : ''; // validated before insertion
    const opts = [['jamaah', "Jama'ah"], ['individual', 'On time'], ['late', 'Late/Qada'], ['missed', 'Missed']];
    const card = document.createElement('div');
    card.className = 'prayer-card';
    card.innerHTML = `
      <div class="prayer-head"><div class="prayer-icon" aria-hidden="true">${p.icon}</div>
        <div><div class="prayer-title">${p.name}</div>${tm ? `<div class="prayer-time">${tm}</div>` : ''}</div></div>
      <div class="status-group" role="group" aria-label="${p.name} status">
        ${opts.map(([v, l]) => `<button type="button" class="status-btn ${s === v ? 'a-' + v : ''}" aria-pressed="${s === v}" onclick="setPrayerStatus('${p.id}','${v}')">${l}</button>`).join('')}
      </div>`;
    box.appendChild(card);
  });
}

function renderSunnah() {
  const box = $('sunnah-list');
  box.innerHTML = '';
  sunnahPrayers.forEach(s => {
    const on = localDayData[s.id] === true;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sunnah-item' + (on ? ' done' : '');
    b.setAttribute('role', 'checkbox');
    b.setAttribute('aria-checked', on);
    b.onclick = () => toggleSunnah(s.id);
    b.innerHTML = `<span>${s.name}</span><i class="fa-solid ${on ? 'fa-square-check' : 'fa-square'}" aria-hidden="true"></i>`;
    box.appendChild(b);
  });
}

function updateProgress() {
  const done = prayers.filter(p => ['true', 'jamaah', 'individual', 'late'].includes(String(localDayData[p.id]))).length;
  const pct = Math.round(done / 5 * 100);
  $('progress-percentage').textContent = pct + '%';
  $('completed-count-text').textContent = `${done} of 5 fardh prayers logged`;
  $('progress-circle').style.background = `conic-gradient(var(--green) ${pct * 3.6}deg, var(--line) 0deg)`;
}

/* ---------- Prayer times & Hijri date ---------- */
function fetchTimes(date) {
  const token = ++timesToken;
  times = {};
  $('hijri-display').textContent = '';
  const [y, m, d] = date.split('-');
  const c = PRAYER_CONFIG;
  fetch(`https://api.aladhan.com/v1/timings/${d}-${m}-${y}?latitude=${c.lat}&longitude=${c.lng}&method=${c.method}`)
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => {
      if (token !== timesToken || !res.data) return;
      times = res.data.timings || {};
      const h = res.data.date && res.data.date.hijri;
      if (h) $('hijri-display').textContent = `${h.day} ${h.month.en} ${h.year} AH`;
      renderFardh();
    })
    .catch(() => {}); // times simply stay hidden if the request fails
}

/* ---------- Streak (last 400 days, refreshed after each save) ---------- */
function refreshStreak() {
  const u = auth.currentUser;
  if (!u) return;
  db.collection('users').doc(u.uid).collection('history')
    .orderBy(firebase.firestore.FieldPath.documentId(), 'desc').limit(400).get()
    .then(snap => {
      const full = new Set();
      snap.forEach(doc => {
        const v = doc.data();
        if (prayers.every(p => v[p.id] && v[p.id] !== 'none' && v[p.id] !== 'missed')) full.add(doc.id);
      });
      const c = new Date();
      if (!full.has(fmt(c))) c.setDate(c.getDate() - 1); // today not finished yet
      let n = 0;
      while (full.has(fmt(c))) { n++; c.setDate(c.getDate() - 1); }
      $('streak-counter').innerHTML = `<i class="fa-solid fa-fire"></i> ${n} day streak`;
    })
    .catch(() => {});
}
</script>
