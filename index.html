<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salah Tracker - Spiritual Dashboard</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (v10 Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-gold: #fbbf24;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 45%);
        }

        .container {
            width: 100%;
            max-width: 520px;
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        /* Auth Screen Styling */
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-icon {
            font-size: 40px;
            color: var(--accent-green);
            margin-bottom: 12px;
            display: inline-block;
            filter: drop-shadow(0 0 12px var(--accent-green-glow));
        }
        .auth-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .auth-header p {
            color: var(--text-sub);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background-color: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px var(--accent-green-glow);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-primary {
            background-color: var(--accent-green);
            color: #0f172a;
        }
        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--accent-green-glow);
        }
        .btn-google {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            margin-top: 14px;
        }
        .btn-google:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .divider {
            text-align: center;
            margin: 18px 0;
            position: relative;
        }
        .divider::before {
            content: "";
            position: absolute;
            left: 0; top: 50%; width: 100%; height: 1px;
            background-color: var(--card-border);
        }
        .divider span {
            position: relative;
            background-color: var(--card-bg);
            padding: 0 12px;
            color: var(--text-sub);
            font-size: 12px;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 16px;
            color: var(--text-sub);
            font-size: 13px;
            cursor: pointer;
        }
        .toggle-auth span {
            color: var(--accent-green);
            font-weight: 600;
        }

        /* Header Bar */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--card-border);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }
        .user-details h4 {
            font-size: 14px;
            font-weight: 600;
        }
        .user-details p {
            font-size: 11px;
            color: var(--text-sub);
        }
        .logout-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            font-size: 16px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* Dashboard & Progress ring */
        .progress-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(59, 130, 246, 0.05));
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }
        .progress-info h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .progress-info p {
            font-size: 12px;
            color: var(--text-sub);
        }

        .circular-progress {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-green) 0deg, var(--card-border) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.4s ease;
        }
        .circular-progress::before {
            content: "";
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--card-bg);
        }
        .progress-value {
            position: relative;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Date Picker Bar */
        .date-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            background-color: rgba(15, 23, 42, 0.4);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
        }
        .date-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }
        .date-btn:hover { color: var(--text-main); background-color: rgba(255,255,255,0.05); }
        .date-input {
            background: none;
            border: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            outline: none;
            cursor: pointer;
        }

        /* Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }
        .tab-item {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-item.active {
            color: var(--accent-green);
            background-color: rgba(16, 185, 129, 0.1);
        }

        /* Prayer Item Cards */
        .prayer-card {
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 12px;
            transition: all 0.25s ease;
        }
        .prayer-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .prayer-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .prayer-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .prayer-icon {
            font-size: 20px;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .prayer-title {
            font-size: 15px;
            font-weight: 600;
        }

        /* Multi-Status Selector Pills */
        .status-group {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
        }
        .status-pill {
            flex: 1;
            padding: 6px 2px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-sub);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .status-pill:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .status-pill.active-jamaah {
            background-color: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        .status-pill.active-individual {
            background-color: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }
        .status-pill.active-late {
            background-color: rgba(251, 191, 36, 0.2);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .status-pill.active-missed {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        /* Sunnah Checklist */
        .sunnah-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sunnah-item.completed {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
        }
        .sunnah-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        /* Reflection Box */
        .reflection-box {
            width: 100%;
            height: 90px;
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            resize: none;
            margin-top: 8px;
        }
        .reflection-box:focus {
            border-color: var(--accent-green);
        }

        /* Toast Popup */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--accent-green);
            color: #0f172a;
            font-weight: 700;
            font-size: 13px;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. AUTHENTICATION SCREEN -->
    <div id="auth-screen">
        <div class="auth-header">
            <div class="auth-icon"><i class="fa-solid font-awesome fa-kaaba"></i></div>
            <h1 id="auth-title">Welcome Back</h1>
            <p>Your private, ad-free spiritual journal</p>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="auth-email" class="form-control" placeholder="saad@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="auth-password" class="form-control" placeholder="••••••••">
        </div>

        <button class="btn btn-primary" id="btn-submit" onclick="handleAuth()">Login</button>
        
        <div class="divider"><span>OR</span></div>

        <button class="btn btn-google" onclick="handleGoogleAuth()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.47h4.84c-.21 1.12-.84 2.07-1.79 2.7l2.79 2.16c1.63-1.51 2.57-3.73 2.57-6.49z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.2l-2.79-2.16c-.78.52-1.77.83-2.79.83-2.14 0-3.94-1.45-4.59-3.41L1.93 13.9C3.41 16.84 6.45 18 9 18z"/><path fill="#FBBC05" d="M4.41 11.06c-.17-.52-.26-1.07-.26-1.64s.09-1.12.26-1.64V5.23H1.93C1.35 6.39 1 7.66 1 9s.35 2.61.93 3.77l2.48-1.71z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.4C13.46.96 11.42 0 9 0 6.45 0 3.41 1.16 1.93 4.1L4.41 5.8c.65-1.96 2.45-3.41 4.59-3.41z"/></svg>
            Continue with Google
        </button>

        <div class="toggle-auth" id="btn-toggle" onclick="toggleAuthMode()">Don't have an account? <span>Sign Up</span></div>
    </div>

    <!-- 2. MAIN APP DASHBOARD -->
    <div id="app-screen" class="hidden">
        <!-- Header -->
        <div class="app-header">
            <div class="user-info">
                <div class="avatar" id="user-avatar">S</div>
                <div class="user-details">
                    <h4 id="display-name">Saad</h4>
                    <p id="display-email">saad@example.com</p>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>

        <!-- Date Selector -->
        <div class="date-bar">
            <button class="date-btn" onclick="changeDate(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <input type="date" id="tracker-date" class="date-input" onchange="loadDateData()">
            <button class="date-btn" onclick="changeDate(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <!-- Progress Overview -->
        <div class="progress-card">
            <div class="progress-info">
                <h3 id="progress-status-title">Daily Progress</h3>
                <p id="completed-count-text">0 of 5 Fardh prayers completed</p>
            </div>
            <div class="circular-progress" id="progress-circle">
                <span class="progress-value" id="progress-percentage">0%</span>
            </div>
        </div>

        <!-- Tabs Navigation -->
        <div class="nav-tabs">
            <div class="tab-item active" onclick="switchTab('fardh')">Fardh Prayers</div>
            <div class="tab-item" onclick="switchTab('sunnah')">Sunnah & Extra</div>
            <div class="tab-item" onclick="switchTab('notes')">Reflections</div>
        </div>

        <!-- TAB 1: FARDH PRAYERS -->
        <div id="tab-fardh">
            <div id="prayer-list"></div>
        </div>

        <!-- TAB 2: SUNNAH PRAYERS -->
        <div id="tab-sunnah" class="hidden">
            <div id="sunnah-list"></div>
        </div>

        <!-- TAB 3: DAILY REFLECTIONS -->
        <div id="tab-notes" class="hidden">
            <label style="font-size:12px; color:var(--text-sub); font-weight:600;">Daily Notes & Spiritual Reflection</label>
            <textarea id="reflection-text" class="reflection-box" placeholder="Write down any notes, Surahs memorized, or reflections for today..."></textarea>
            <button class="btn btn-primary" style="margin-top:10px;" onclick="saveReflection()">Save Reflection</button>
        </div>
    </div>
</div>

<div id="toast" class="toast">Saved successfully!</div>

<script>
    // Firebase Credentials from your console
    const firebaseConfig = {
        apiKey: "AIzaSyCf3fUwyksRPnVyqjrLJpTxdnZxDYA_4Mo",
        authDomain: "prayer-tracker-d9d1f.firebaseapp.com",
        projectId: "prayer-tracker-d9d1f",
        storageBucket: "prayer-tracker-d9d1f.firebasestorage.app",
        messagingSenderId: "904988992102",
        appId: "1:904988992102:web:7873d573ef75e9520383a7",
        measurementId: "G-P7VLZ78NC1"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isSignUpMode = false;
    let currentSelectedDate = '';
    
    const prayers = [
        { id: 'fajr', name: 'Fajr', icon: '🌅' },
        { id: 'dhuhr', name: 'Dhuhr', icon: '☀️' },
        { id: 'asr', name: 'Asr', icon: '🌤️' },
        { id: 'maghrib', name: 'Maghrib', icon: '🌇' },
        { id: 'isha', name: 'Isha', icon: '🌙' }
    ];

    const sunnahPrayers = [
        { id: 'tahajjud', name: 'Tahajjud (Night Prayer)' },
        { id: 'duha', name: 'Duha (Forenoon)' },
        { id: 'rawatib', name: 'Sunnah Rawatib' },
        { id: 'witr', name: 'Witr Prayer' }
    ];

    // Listen for Auth State Changes
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            
            const name = user.displayName || user.email.split('@')[0];
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-email').innerText = user.email;
            document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();

            // Default to local date in YYYY-MM-DD
            const today = new Date().toLocaleDateString('sv');
            document.getElementById('tracker-date').value = today;
            currentSelectedDate = today;

            loadDateData();
        } else {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }
    });

    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('auth-title').innerText = isSignUpMode ? "Create Account" : "Welcome Back";
        document.getElementById('btn-submit').innerText = isSignUpMode ? "Sign Up" : "Login";
        document.getElementById('btn-toggle').innerHTML = isSignUpMode ? 
            "Already have an account? <span>Login</span>" : 
            "Don't have an account? <span>Sign Up</span>";
    }

    function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        if (!email || !password) return alert("Please fill in all fields.");

        if (isSignUpMode) {
            auth.createUserWithEmailAndPassword(email, password).catch(err => alert(err.message));
        } else {
            auth.signInWithEmailAndPassword(email, password).catch(err => alert(err.message));
        }
    }

    function handleGoogleAuth() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("Google Login Failed: " + err.message));
    }

    function logout() {
        auth.signOut();
    }

    function changeDate(days) {
        const dateInput = document.getElementById('tracker-date');
        const d = new Date(dateInput.value);
        d.setDate(d.getDate() + days);
        dateInput.value = d.toLocaleDateString('sv');
        loadDateData();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-fardh').classList.add('hidden');
        document.getElementById('tab-sunnah').classList.add('hidden');
        document.getElementById('tab-notes').classList.add('hidden');

        if (tab === 'fardh') {
            document.querySelectorAll('.tab-item')[0].classList.add('active');
            document.getElementById('tab-fardh').classList.remove('hidden');
        } else if (tab === 'sunnah') {
            document.querySelectorAll('.tab-item')[1].classList.add('active');
            document.getElementById('tab-sunnah').classList.remove('hidden');
        } else {
            document.querySelectorAll('.tab-item')[2].classList.add('active');
            document.getElementById('tab-notes').classList.remove('hidden');
        }
    }

    function loadDateData() {
        const user = auth.currentUser;
        if (!user) return;

        currentSelectedDate = document.getElementById('tracker-date').value;
        const docRef = db.collection('users').doc(user.uid).collection('history').doc(currentSelectedDate);

        docRef.get().then(doc => {
            let data = doc.exists ? doc.data() : {};
            renderFardhList(data);
            renderSunnahList(data);
            document.getElementById('reflection-text').value = data.notes || '';
            updateProgress(data);
        }).catch(err => console.error("Error loading data: ", err));
    }

    function renderFardhList(data) {
        const container = document.getElementById('prayer-list');
        container.innerHTML = '';

        prayers.forEach(prayer => {
            let status = data[prayer.id];
            // Backward compatibility for simple boolean 'true' values
            if (status === true) status = 'individual';
            if (status === false || !status) status = 'none';

            const card = document.createElement('div');
            card.className = 'prayer-card';
            card.innerHTML = `
                <div class="prayer-main">
                    <div class="prayer-header">
                        <div class="prayer-icon">${prayer.icon}</div>
                        <div class="prayer-title">${prayer.name}</div>
                    </div>
                </div>
                <div class="status-group">
                    <div class="status-pill ${status === 'jamaah' ? 'active-jamaah' : ''}" onclick="setPrayerStatus('${prayer.id}', 'jamaah')">Jama'ah</div>
                    <div class="status-pill ${status === 'individual' ? 'active-individual' : ''}" onclick="setPrayerStatus('${prayer.id}', 'individual')">On Time</div>
                    <div class="status-pill ${status === 'late' ? 'active-late' : ''}" onclick="setPrayerStatus('${prayer.id}', 'late')">Late/Qada</div>
                    <div class="status-pill ${status === 'missed' ? 'active-missed' : ''}" onclick="setPrayerStatus('${prayer.id}', 'missed')">Missed</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderSunnahList(data) {
        const container = document.getElementById('sunnah-list');
        container.innerHTML = '';

        sunnahPrayers.forEach(s => {
            const isChecked = data[s.id] === true;
            const item = document.createElement('div');
            item.className = `sunnah-item ${isChecked ? 'completed' : ''}`;
            item.onclick = () => toggleSunnah(s.id, isChecked);
            item.innerHTML = `
                <span style="font-size:14px; font-weight:500;">${s.name}</span>
                <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleSunnah('${s.id}', ${isChecked})">
            `;
            container.appendChild(item);
        });
    }

    function setPrayerStatus(prayerId, newStatus) {
        const user = auth.currentUser;
        if (!user) return;

        const docRef = db.collection('users').doc(user.uid).collection('history').doc(currentSelectedDate);
        
        // Toggle off if clicking the currently active status
        docRef.get().then(doc => {
            let current = doc.exists ? doc.data()[prayerId] : null;
            if (current === true) current = 'individual';
            
            const finalStatus = (current === newStatus) ? 'none' : newStatus;
            
            docRef.set({ [prayerId]: finalStatus }, { merge: true }).then(() => {
                showToast("Updated!");
                loadDateData();
            });
        });
    }

    function toggleSunnah(sunnahId, currentStatus) {
        const user = auth.currentUser;
        if (!user) return;

        const docRef = db.collection('users').doc(user.uid).collection('history').doc(currentSelectedDate);
        docRef.set({ [sunnahId]: !currentStatus }, { merge: true }).then(() => {
            showToast("Saved!");
            loadDateData();
        });
    }

    function saveReflection() {
        const user = auth.currentUser;
        if (!user) return;

        const text = document.getElementById('reflection-text').value;
        const docRef = db.collection('users').doc(user.uid).collection('history').doc(currentSelectedDate);
        docRef.set({ notes: text }, { merge: true }).then(() => {
            showToast("Reflection saved!");
        });
    }

    function updateProgress(data) {
        let completed = 0;
        prayers.forEach(p => {
            const val = data[p.id];
            if (val === true || val === 'jamaah' || val === 'individual' || val === 'late') {
                completed++;
            }
        });

        const percentage = Math.round((completed / 5) * 100);
        document.getElementById('progress-percentage').innerText = `${percentage}%`;
        document.getElementById('completed-count-text').innerText = `${completed} of 5 Fardh prayers logged`;
        
        const circle = document.getElementById('progress-circle');
        circle.style.background = `conic-gradient(var(--accent-green) ${percentage * 3.6}deg, var(--card-border) 0deg)`;
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
</script>
</body>
</html>
